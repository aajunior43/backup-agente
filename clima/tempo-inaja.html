<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previsão do Tempo — Inajá, PR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; font-family: 'DM Mono', monospace; color: #e8eaf0; overflow-x: hidden; }
  body {
    background: linear-gradient(180deg, #0a0e27 0%, #141938 40%, #1a2050 100%);
    position: relative;
    padding: 1.5rem;
  }
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star { position: absolute; background: white; border-radius: 50%; opacity: 0.6; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }

  .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(1.8rem, 4vw, 2.6rem);
    background: linear-gradient(90deg, #4fc3f7, #7c4dff, #f5a623);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -0.5px;
  }
  header p { color: #8a92a8; font-size: 0.9rem; margin-top: 0.4rem; }
  .updated { display: inline-block; margin-top: 0.5rem; padding: 0.3rem 0.7rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; font-size: 0.75rem; color: #8a92a8; }

  .glass {
    background: rgba(20, 25, 56, 0.55);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }

  .hero { padding: 2rem; margin-bottom: 1.5rem; display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 720px) { .hero { grid-template-columns: 1.2fr 1fr; align-items: center; } }
  .hero-main { display: flex; align-items: center; gap: 1.5rem; }
  .hero-icon { font-size: 5rem; line-height: 1; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); }
  .hero-temp { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 4.5rem; line-height: 1; }
  .hero-temp sup { font-size: 1.8rem; vertical-align: top; opacity: 0.7; }
  .hero-cond { font-size: 1.1rem; color: #c5cbd9; margin-top: 0.3rem; }
  .hero-feel { font-size: 0.85rem; color: #8a92a8; margin-top: 0.2rem; }
  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .stat { padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .stat-label { font-size: 0.7rem; color: #8a92a8; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.3rem; margin-top: 0.2rem; }

  section { margin-bottom: 1.5rem; }
  .sec-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; margin-bottom: 0.9rem; color: #c5cbd9; padding-left: 0.3rem; }

  .hourly-wrap { padding: 1.2rem; overflow-x: auto; }
  .hourly { display: flex; gap: 0.7rem; min-width: max-content; }
  .hour { flex: 0 0 auto; width: 78px; padding: 0.8rem 0.5rem; background: rgba(255,255,255,0.04); border-radius: 14px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
  .hour.now { background: rgba(124, 77, 255, 0.18); border-color: rgba(124, 77, 255, 0.4); }
  .hour h4 { font-size: 0.7rem; color: #8a92a8; font-weight: 400; }
  .hour .icon { font-size: 1.6rem; margin: 0.3rem 0; }
  .hour .temp { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; }
  .hour .pop { font-size: 0.7rem; color: #4fc3f7; margin-top: 0.3rem; }

  .daily-wrap { padding: 1rem; }
  .day { display: grid; grid-template-columns: 70px 40px 1fr 90px; align-items: center; gap: 0.8rem; padding: 0.8rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .day:last-child { border-bottom: none; }
  .day-name { font-size: 0.85rem; color: #c5cbd9; }
  .day-name small { display: block; color: #8a92a8; font-size: 0.7rem; margin-top: 0.1rem; }
  .day-icon { font-size: 1.5rem; text-align: center; }
  .day-range { display: flex; align-items: center; gap: 0.4rem; }
  .day-min { color: #4fc3f7; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.95rem; width: 40px; text-align: right; }
  .day-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; position: relative; overflow: hidden; }
  .day-bar-fill { position: absolute; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4fc3f7, #f5a623, #ff6b6b); }
  .day-max { color: #ff8a65; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; width: 40px; }
  .day-info { font-size: 0.7rem; color: #8a92a8; text-align: right; }
  .day-info .rain { color: #4fc3f7; }

  .chart-wrap { padding: 1.2rem; }
  canvas { width: 100%; height: 220px; display: block; }

  footer { text-align: center; padding: 1.5rem 0 1rem; color: #8a92a8; font-size: 0.75rem; }
  footer a { color: #4fc3f7; text-decoration: none; }

  .loading, .error { text-align: center; padding: 3rem 1rem; }
  .spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #4fc3f7; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: #ff6b6b; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="container">
  <header>
    <h1>Previsão do Tempo</h1>
    <p>📍 Inajá, Paraná</p>
    <span class="updated" id="updated">Carregando…</span>
  </header>

  <div id="app">
    <div class="loading glass">
      <div class="spinner"></div>
      <p>Buscando dados meteorológicos…</p>
    </div>
  </div>

  <footer>
    Dados: <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> · Coordenadas: -22.7758, -51.9011 · Fuso: America/Sao_Paulo
  </footer>
</div>

<script>
const LAT = -22.7758, LON = -51.9011;
const WMO = {
  0: { label: 'Céu limpo', icon: '☀️' },
  1: { label: 'Principalmente limpo', icon: '🌤️' },
  2: { label: 'Parcialmente nublado', icon: '⛅' },
  3: { label: 'Nublado', icon: '☁️' },
  45: { label: 'Neblina', icon: '🌫️' },
  48: { label: 'Geada com neblina', icon: '🌫️' },
  51: { label: 'Garoa leve', icon: '🌦️' },
  53: { label: 'Garoa moderada', icon: '🌦️' },
  55: { label: 'Garoa intensa', icon: '🌧️' },
  61: { label: 'Chuva leve', icon: '🌧️' },
  63: { label: 'Chuva moderada', icon: '🌧️' },
  65: { label: 'Chuva forte', icon: '🌧️' },
  80: { label: 'Pancadas de chuva', icon: '🌦️' },
  81: { label: 'Pancadas moderadas', icon: '🌧️' },
  82: { label: 'Pancadas fortes', icon: '⛈️' },
  95: { label: 'Tempestade', icon: '⛈️' },
  96: { label: 'Tempestade com granizo', icon: '⛈️' },
  99: { label: 'Tempestade forte', icon: '🌩️' },
};
const WEEKDAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

function degToCompass(deg) {
  const arr = ['N','NE','L','SE','S','SO','O','NO'];
  return arr[Math.round(deg / 45) % 8];
}

function buildURL() {
  const params = new URLSearchParams({
    latitude: LAT, longitude: LON, timezone: 'America/Sao_Paulo',
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index,visibility',
    hourly: 'temperature_2m,precipitation_probability,weather_code,wind_speed_10m,relative_humidity_2m',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,uv_index_max,sunrise,sunset',
    forecast_days: 7, wind_speed_unit: 'kmh', precipitation_unit: 'mm'
  });
  return `https://api.open-meteo.com/v1/forecast?${params}`;
}

async function fetchWeather() {
  try {
    const res = await fetch(buildURL());
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    renderAll(data);
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="error glass">
        <p class="error-msg">⚠️ Não foi possível carregar os dados.</p>
        <p style="color:#8a92a8;font-size:0.85rem;margin-top:0.5rem;">Verifique sua conexão e tente novamente.</p>
      </div>`;
  }
}

function renderAll(data) {
  const c = data.current, h = data.hourly, d = data.daily;
  const now = new Date();
  const todayIdx = d.time.findIndex(t => t === now.toISOString().slice(0,10));
  const cond = WMO[c.weather_code] || WMO[3];

  const heroHTML = `
    <div class="hero glass">
      <div class="hero-main">
        <div class="hero-icon">${cond.icon}</div>
        <div>
          <div class="hero-temp">${Math.round(c.temperature_2m)}<sup>°C</sup></div>
          <div class="hero-cond">${cond.label}</div>
          <div class="hero-feel">Sensação: ${Math.round(c.apparent_temperature)}°C</div>
        </div>
      </div>
      <div class="hero-grid">
        <div class="stat"><div class="stat-label">💧 Umidade</div><div class="stat-value">${c.relative_humidity_2m}%</div></div>
        <div class="stat"><div class="stat-label">💨 Vento</div><div class="stat-value">${Math.round(c.wind_speed_10m)} km/h</div></div>
        <div class="stat"><div class="stat-label">🌡️ Pressão</div><div class="stat-value">${Math.round(c.surface_pressure)} hPa</div></div>
        <div class="stat"><div class="stat-label">☀️ UV</div><div class="stat-value">${c.uv_index.toFixed(1)}</div></div>
        <div class="stat"><div class="stat-label">👁️ Visibilidade</div><div class="stat-value">${(c.visibility/1000).toFixed(1)} km</div></div>
        <div class="stat"><div class="stat-label">🧭 Direção</div><div class="stat-value">${degToCompass(c.wind_direction_10m)} ${Math.round(c.wind_direction_10m)}°</div></div>
      </div>
    </div>
  `;

  // Hourly: pegar a partir da hora atual (próximas 24h)
  const currentHour = now.getHours();
  const startIdx = h.time.findIndex(t => new Date(t).getHours() === currentHour && t.startsWith(now.toISOString().slice(0,10)));
  const start = startIdx >= 0 ? startIdx : 0;
  const hours = [];
  for (let i = 0; i < 24; i++) {
    const idx = start + i;
    if (idx >= h.time.length) break;
    const dt = new Date(h.time[idx]);
    hours.push(`
      <div class="hour ${i === 0 ? 'now' : ''}">
        <h4>${i === 0 ? 'Agora' : dt.getHours().toString().padStart(2,'0') + 'h'}</h4>
        <div class="icon">${(WMO[h.weather_code[idx]] || WMO[3]).icon}</div>
        <div class="temp">${Math.round(h.temperature_2m[idx])}°</div>
        <div class="pop">💧 ${h.precipitation_probability[idx] ?? 0}%</div>
      </div>
    `);
  }

  const dailyHTML = d.time.map((t, i) => {
    const dt = new Date(t + 'T12:00:00');
    const min = d.temperature_2m_min[i], max = d.temperature_2m_max[i];
    const allMin = Math.min(...d.temperature_2m_min);
    const allMax = Math.max(...d.temperature_2m_max);
    const span = allMax - allMin || 1;
    const left = ((min - allMin) / span) * 100;
    const width = ((max - min) / span) * 100;
    const wmo = WMO[d.weather_code[i]] || WMO[3];
    const isToday = i === todayIdx;
    return `
      <div class="day" style="${isToday ? 'background:rgba(124,77,255,0.08);border-radius:10px;padding:0.8rem;margin:-0.2rem 0;' : ''}">
        <div class="day-name">${isToday ? 'Hoje' : WEEKDAYS[dt.getDay()]}<small>${dt.getDate()}/${(dt.getMonth()+1).toString().padStart(2,'0')}</small></div>
        <div class="day-icon">${wmo.icon}</div>
        <div class="day-range">
          <span class="day-min">${Math.round(min)}°</span>
          <div class="day-bar"><div class="day-bar-fill" style="left:${left}%;width:${Math.max(width,5)}%"></div></div>
          <span class="day-max">${Math.round(max)}°</span>
        </div>
        <div class="day-info">${d.precipitation_probability_max[i] > 0 ? `<span class="rain">🌧 ${d.precipitation_sum[i].toFixed(1)}mm ${d.precipitation_probability_max[i]}%</span>` : '—'}</div>
      </div>
    `;
  }).join('');

  document.getElementById('app').innerHTML = `
    ${heroHTML}
    <section>
      <h2 class="sec-title">⏰ Próximas 24 horas</h2>
      <div class="hourly-wrap glass"><div class="hourly">${hours.join('')}</div></div>
    </section>
    <section>
      <h2 class="sec-title">📅 Próximos 7 dias</h2>
      <div class="daily-wrap glass">${dailyHTML}</div>
    </section>
    <section>
      <h2 class="sec-title">📊 Temperatura e chuva (7 dias)</h2>
      <div class="chart-wrap glass"><canvas id="chart"></canvas></div>
    </section>
  `;

  document.getElementById('updated').textContent = 'Atualizado: ' + now.toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' · ' + now.toLocaleDateString('pt-BR');

  drawChart(d);
}

function drawChart(d) {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 220;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const padL = 38, padR = 38, padT = 16, padB = 32;
  const cw = w - padL - padR, ch = h - padT - padB;
  const n = d.time.length;
  const allMin = Math.min(...d.temperature_2m_min);
  const allMax = Math.max(...d.temperature_2m_max);
  const tMin = Math.floor((allMin - 2) / 5) * 5;
  const tMax = Math.ceil((allMax + 2) / 5) * 5;
  const tRange = tMax - tMin || 1;
  const maxRain = Math.max(...d.precipitation_sum, 5);

  // Grid + Y labels
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.fillStyle = '#8a92a8';
  ctx.font = '10px DM Mono';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (ch * i) / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    const tVal = tMax - (tRange * i) / 4;
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(tVal) + '°', padL - 6, y + 3);
  }

  // Bars (precipitation)
  const barW = cw / n * 0.5;
  d.precipitation_sum.forEach((r, i) => {
    if (r <= 0) return;
    const x = padL + (cw / n) * i + (cw / n - barW) / 2;
    const bh = (r / maxRain) * ch;
    const y = padT + ch - bh;
    const grad = ctx.createLinearGradient(0, y, 0, y + bh);
    grad.addColorStop(0, 'rgba(79,195,247,0.7)');
    grad.addColorStop(1, 'rgba(79,195,247,0.15)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, barW, bh);
  });

  // Min line
  ctx.strokeStyle = '#4fc3f7';
  ctx.fillStyle = '#4fc3f7';
  ctx.lineWidth = 2;
  ctx.beginPath();
  d.temperature_2m_min.forEach((t, i) => {
    const x = padL + (cw / n) * i + cw / n / 2;
    const y = padT + ((tMax - t) / tRange) * ch;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  d.temperature_2m_min.forEach((t, i) => {
    const x = padL + (cw / n) * i + cw / n / 2;
    const y = padT + ((tMax - t) / tRange) * ch;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
  });

  // Max line
  ctx.strokeStyle = '#ff8a65';
  ctx.fillStyle = '#ff8a65';
  ctx.lineWidth = 2;
  ctx.beginPath();
  d.temperature_2m_max.forEach((t, i) => {
    const x = padL + (cw / n) * i + cw / n / 2;
    const y = padT + ((tMax - t) / tRange) * ch;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  d.temperature_2m_max.forEach((t, i) => {
    const x = padL + (cw / n) * i + cw / n / 2;
    const y = padT + ((tMax - t) / tRange) * ch;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
  });

  // X labels
  ctx.fillStyle = '#c5cbd9';
  ctx.textAlign = 'center';
  ctx.font = '11px DM Mono';
  d.time.forEach((t, i) => {
    const dt = new Date(t + 'T12:00:00');
    const x = padL + (cw / n) * i + cw / n / 2;
    ctx.fillText(WEEKDAYS[dt.getDay()].toUpperCase(), x, h - padB + 14);
    ctx.fillText(dt.getDate() + '/' + (dt.getMonth()+1), x, h - padB + 26);
  });

  // Legend
  ctx.font = '10px DM Mono';
  ctx.fillStyle = '#ff8a65';
  ctx.textAlign = 'left';
  ctx.fillRect(padL, 4, 10, 3); ctx.fillText('Máx', padL + 14, 8);
  ctx.fillStyle = '#4fc3f7';
  ctx.fillRect(padL + 50, 4, 10, 3); ctx.fillText('Mín', padL + 64, 8);
  ctx.fillStyle = 'rgba(79,195,247,0.7)';
  ctx.fillRect(padL + 100, 4, 10, 3); ctx.fillText('Chuva (mm)', padL + 114, 8);
}

// Stars background
(function initStars(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; draw(); }
  const stars = [];
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s => {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
  }
  for (let i = 0; i < 120; i++) {
    stars.push({ x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, r: Math.random()*1.4, a: 0.2 + Math.random()*0.7 });
  }
  resize();
  window.addEventListener('resize', resize);
  setInterval(() => {
    stars.forEach(s => { s.a += (Math.random() - 0.5) * 0.1; s.a = Math.max(0.1, Math.min(1, s.a)); });
    draw();
  }, 1500);
})();

fetchWeather();
</script>
</body>
</html>
