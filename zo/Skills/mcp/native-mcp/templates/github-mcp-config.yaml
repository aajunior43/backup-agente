# Quick-start template: GitHub MCP server configuration
# Copy this into ~/.hermes/config.yaml and replace the token.
#
# To get a token: https://github.com/settings/tokens
# Required scopes: repo, read:user, read:org, issues, pull_requests
#
mcp_servers:
  github:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "ghp_YOUR_TOKEN_HERE"
    timeout: 60
