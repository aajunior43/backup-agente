<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterChef Brasil - Temporada 6</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, #e63946, #9d0208);
    border-radius: 16px;
    margin-bottom: 24px;
  }
  header h1 { font-size: 2.2rem; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  header p { color: #ffd6d6; margin-top: 6px; font-size: 0.95rem; }
  .progress-bar-container {
    background: #16213e;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .progress-bar-container label { font-weight: 600; font-size: 0.9rem; }
  .progress-bar {
    flex: 1;
    min-width: 200px;
    height: 12px;
    background: #0f3460;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #e63946, #f4a261);
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  .progress-text { font-weight: 700; font-size: 0.9rem; color: #f4a261; }
  .btn-reset {
    background: #0f3460;
    color: #eee;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .btn-reset:hover { background: #1a4a7a; }
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    padding: 8px 18px;
    border-radius: 20px;
    border: 2px solid #0f3460;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    background: #0f3460;
    color: #fff;
    border-color: #e63946;
  }
  .btn-watch-here {
    margin-left: auto;
    background: #e63946;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.2s;
  }
  .btn-watch-here:hover { background: #c1121f; }
  .episode-list { display: flex; flex-direction: column; gap: 12px; }
  .episode-card {
    background: #16213e;
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
    border: 2px solid transparent;
  }
  .episode-card:hover { border-color: #e63946; transform: translateX(4px); }
  .episode-card.watched { opacity: 0.55; }
  .episode-card.watched .ep-title { text-decoration: line-through; color: #888; }
  .checkbox-wrapper { position: relative; }
  .checkbox-wrapper input[type="checkbox"] {
    width: 28px;
    height: 28px;
    cursor: pointer;
    accent-color: #e63946;
    border-radius: 6px;
  }
  .ep-number {
    font-size: 1.4rem;
    font-weight: 800;
    color: #e63946;
    min-width: 40px;
    text-align: center;
  }
  .ep-info { flex: 1; }
  .ep-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
  .ep-meta { font-size: 0.8rem; color: #888; display: flex; gap: 12px; flex-wrap: wrap; }
  .ep-meta span { display: flex; align-items: center; gap: 4px; }
  .ep-badge {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-duel { background: #5a189a; color: #e0aaff; }
  .badge-top { background: #0f3460; color: #90e0ef; }
  .badge-return { background: #2d6a4f; color: #95d5b2; }
  .badge-finale { background: #e63946; color: #fff; }
  .badge-reinstation { background: #e76f51; color: #fff; }
  .rating { font-size: 0.8rem; color: #f4a261; font-weight: 600; min-width: 50px; text-align: right; }
  .empty-msg { text-align: center; padding: 40px; color: #666; font-size: 1.1rem; }
  footer { text-align: center; margin-top: 30px; color: #555; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍳 MasterChef Brasil</h1>
    <p>Temporada 6 — 22 episódios — Exibida de 24/03/2019 a 25/08/2019</p>
    <p style="margin-top:4px;font-size:0.85rem;color:#ffb3b3;">Vencedor: Rodrigo Massoni | Vice: Lorena Dayse</p>
  </header>

  <div class="progress-bar-container">
    <label>Progresso:</label>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">0/22</span>
    <button class="btn-reset" onclick="resetAll()">Resetar</button>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterEp('all', this)">Todos</button>
    <button class="filter-btn" onclick="filterEp('unwatched', this)">Não assistidos</button>
    <button class="filter-btn" onclick="filterEp('watched', this)">Assistidos</button>
    <button class="btn-watch-here" onclick="watchUntil()">
      ✓ Assisti até aqui
    </button>
  </div>

  <div class="episode-list" id="episodeList"></div>

  <footer>
    <p>Dados salvos no navegador (localStorage). Fonte: Wikipedia / MasterChef Wiki.</p>
  </footer>
</div>

<script>
const episodes = [
  { n: 1,  title: "Top 44 — Duelos (1)",           date: "24/03/2019", sp: "4.1", br: "2.7", badge: "duel",        badgeTxt: "Duelos" },
  { n: 2,  title: "Top 44 — Duelos (2)",           date: "31/03/2019", sp: "3.7", br: "2.5", badge: "duel",        badgeTxt: "Duelos" },
  { n: 3,  title: "Top 19",                         date: "07/04/2019", sp: "3.2", br: "2.6", badge: "top",         badgeTxt: "Top 19" },
  { n: 4,  title: "Top 18",                         date: "14/04/2019", sp: "2.7", br: "2.2", badge: "top",         badgeTxt: "Top 18" },
  { n: 5,  title: "Top 17",                         date: "21/04/2019", sp: "3.9", br: "2.7", badge: "top",         badgeTxt: "Top 17" },
  { n: 6,  title: "Top 16",                         date: "28/04/2019", sp: "3.2", br: "—",   badge: "top",         badgeTxt: "Top 16" },
  { n: 7,  title: "Top 15",                         date: "05/05/2019", sp: "3.8", br: "2.9", badge: "top",         badgeTxt: "Top 15" },
  { n: 8,  title: "Top 14",                         date: "12/05/2019", sp: "4.2", br: "2.8", badge: "top",         badgeTxt: "Top 14" },
  { n: 9,  title: "Top 13",                         date: "19/05/2019", sp: "3.8", br: "2.7", badge: "top",         badgeTxt: "Top 13" },
  { n: 10, title: "Top 12",                         date: "26/05/2019", sp: "3.5", br: "2.7", badge: "top",         badgeTxt: "Top 12" },
  { n: 11, title: "Top 11",                         date: "09/06/2019", sp: "3.7", br: "2.7", badge: "top",         badgeTxt: "Top 11" },
  { n: 12, title: "Prova do Retorno",               date: "16/06/2019", sp: "3.7", br: "2.9", badge: "reinstation", badgeTxt: "Retorno" },
  { n: 13, title: "Top 11 — Retorno",               date: "23/06/2019", sp: "3.9", br: "2.8", badge: "return",      badgeTxt: "Top 11" },
  { n: 14, title: "Top 10",                         date: "30/06/2019", sp: "3.0", br: "2.6", badge: "top",         badgeTxt: "Top 10" },
  { n: 15, title: "Top 9",                          date: "07/07/2019", sp: "3.6", br: "2.8", badge: "top",         badgeTxt: "Top 9" },
  { n: 16, title: "Top 8",                          date: "14/07/2019", sp: "3.2", br: "2.7", badge: "top",         badgeTxt: "Top 8" },
  { n: 17, title: "Top 7",                          date: "21/07/2019", sp: "3.1", br: "2.8", badge: "top",         badgeTxt: "Top 7" },
  { n: 18, title: "Top 6",                          date: "28/07/2019", sp: "3.4", br: "2.9", badge: "top",         badgeTxt: "Top 6" },
  { n: 19, title: "Top 5",                          date: "04/08/2019", sp: "3.3", br: "2.7", badge: "top",         badgeTxt: "Top 5" },
  { n: 20, title: "Top 4",                          date: "11/08/2019", sp: "3.8", br: "2.8", badge: "top",         badgeTxt: "Top 4" },
  { n: 21, title: "Top 3",                          date: "18/08/2019", sp: "4.0", br: "3.1", badge: "top",         badgeTxt: "Top 3" },
  { n: 22, title: "Grande Final",                   date: "25/08/2019", sp: "4.4", br: "3.8", badge: "finale",      badgeTxt: "Final" }
];

const STORAGE_KEY = 'mcbr_s6_watched';

function getWatched() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveWatched(w) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(w));
}

function toggleEp(n) {
  const w = getWatched();
  w[n] = !w[n];
  saveWatched(w);
  render();
}

function resetAll() {
  if (confirm('Marcar todos como não assistidos?')) {
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
}

function watchUntil() {
  const input = prompt('Já assistiu até qual episódio? (Digite o número de 1 a 22)');
  const num = parseInt(input);
  if (isNaN(num) || num < 1 || num > episodes.length) {
    if (input !== null) alert('Número inválido. Digite entre 1 e ' + episodes.length + '.');
    return;
  }
  if (confirm('Marcar episódios 1 a ' + num + ' como assistidos?')) {
    const w = getWatched();
    for (let i = 1; i <= num; i++) w[i] = true;
    saveWatched(w);
    render();
  }
}

let currentFilter = 'all';

function filterEp(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const w = getWatched();
  const list = document.getElementById('episodeList');
  list.innerHTML = '';

  let count = 0;
  let visibleCount = 0;

  episodes.forEach(ep => {
    const isWatched = !!w[ep.n];
    if (isWatched) count++;

    if (currentFilter === 'watched' && !isWatched) return;
    if (currentFilter === 'unwatched' && isWatched) return;
    visibleCount++;

    const card = document.createElement('div');
    card.className = 'episode-card' + (isWatched ? ' watched' : '');
    card.innerHTML = `
      <div class="checkbox-wrapper">
        <input type="checkbox" ${isWatched ? 'checked' : ''} onchange="toggleEp(${ep.n})" aria-label="Episódio ${ep.n}">
      </div>
      <div class="ep-number">${String(ep.n).padStart(2, '0')}</div>
      <div class="ep-info">
        <div class="ep-title">${ep.title}</div>
        <div class="ep-meta">
          <span>📅 ${ep.date}</span>
          <span>🏷️ <span class="ep-badge ep-badge-${ep.badge}">${ep.badgeTxt}</span></span>
        </div>
      </div>
      <div class="rating">SP: ${ep.sp}</div>
    `;
    list.appendChild(card);
  });

  if (visibleCount === 0) {
    list.innerHTML = '<div class="empty-msg">Nenhum episódio encontrado com esse filtro.</div>';
  }

  const pct = (count / episodes.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${count}/${episodes.length}`;
}

render();
</script>
</body>
</html>
